name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      # rusqlite is built with the bundled SQLite, so the C compiler has to be
      # present for the target. musl-tools provides musl-gcc.
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Inspect the binary
        run: |
          file target/${{ matrix.target }}/release/ai-proxy
          ls -l target/${{ matrix.target }}/release/ai-proxy

      - name: Checksum
        working-directory: target/${{ matrix.target }}/release
        run: |
          sha256sum ai-proxy > ai-proxy.sha256
          cat ai-proxy.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ai-proxy-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ai-proxy
            target/${{ matrix.target }}/release/ai-proxy.sha256
          if-no-files-found: error
          retention-days: 30
